name: Android 11 fork - unsigned APK

on:
  push:
    branches: [android11-backport]
    paths: ['android/**', '.github/workflows/ci-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/ci-android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy tools package is no longer available; install our pinned packages below.
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;30.0.14904198' 'cmake;3.22.1'
      - name: Check Android APIs, run tests and build unsigned release
        working-directory: android
        run: ./gradlew --no-daemon --no-configuration-cache --max-workers=2 -Pandroid11ApiCheck lintFossDebug testFossDebugUnitTest assembleFossRelease
      - name: Inspect release and record checksums
        run: |
          mkdir -p artifacts
          APK=android/app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK" > artifacts/apk-metadata.txt
          grep -qx "minSdkVersion:'30'" artifacts/apk-metadata.txt
          if "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo 'Expected an unsigned APK; refusing to publish a signed artifact.'
            exit 1
          fi
          cp "$APK" artifacts/LibrePods-Android11-unsigned.apk
          cd artifacts
          sha256sum LibrePods-Android11-unsigned.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LibrePods-Android11-unsigned
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android11-test-reports
          path: |
            android/app/build/reports/lint-results-fossDebug.*
            android/app/build/reports/tests/testFossDebugUnitTest/
            android/app/build/test-results/testFossDebugUnitTest/
